name: Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release ZIP
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build plugin ZIP
        shell: bash
        run: mvn -U -B -ntp -DskipTests -pl assemblies/assemblies-transform-graalpy -am package

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -N -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve project.version from Maven" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate packaged ZIP
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          target_dir="assemblies/assemblies-transform-graalpy/target"
          expected_name="hop-transform-graalpy-${version}.zip"

          mapfile -t zip_files < <(find "$target_dir" -maxdepth 1 -type f -name '*.zip' | sort)

          if [[ ${#zip_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 ZIP in $target_dir, found ${#zip_files[@]}" >&2
            printf '%s\n' "${zip_files[@]}"
            exit 1
          fi

          zip_path="${zip_files[0]}"
          zip_name="$(basename "$zip_path")"

          if [[ "$zip_name" != "$expected_name" ]]; then
            echo "Unexpected ZIP name: expected $expected_name, found $zip_name" >&2
            exit 1
          fi

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          ls -lh "$zip_path"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          if-no-files-found: error
          path: ${{ steps.asset.outputs.zip_path }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist

      - name: Collect ZIP asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t zip_files < <(find dist -type f -name '*.zip' | sort)

          if [[ ${#zip_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 ZIP under dist/, found ${#zip_files[@]}" >&2
            find dist -maxdepth 4 -type f -print || true
            exit 1
          fi

          zip_path="${zip_files[0]}"
          zip_name="$(basename "$zip_path")"
          cp "$zip_path" "release-assets/$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          ls -la release-assets

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          safe_version="${version//+/-}"
          timestamp="$(date -u +%Y%m%d-%H%M)"
          short_sha="${GITHUB_SHA::7}"
          tag="auto-v${safe_version}-${timestamp}-${short_sha}"
          name="Auto Release ${version} (${timestamp} UTC)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.zip
